<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<title>Оплата прошла</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Golos Text';font-weight:400;font-display:swap;src:url(fonts/golos-400-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:600;font-display:swap;src:url(fonts/golos-600-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:400;font-display:swap;src:url(fonts/golos-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2191}
@font-face{font-family:'Golos Text';font-weight:600;font-display:swap;src:url(fonts/golos-600-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2191}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f1f1;color:#1c1b18;font-family:'Golos Text',Arial,sans-serif;font-size:17px;line-height:1.6;padding:24px}
.box{background:#fff;border:1px solid #e6e6e6;border-radius:10px;max-width:520px;width:100%;padding:44px 40px;text-align:center}
h1{font-size:30px;font-weight:600;margin:0 0 14px}
p{color:#3d3d3a;margin:0 0 16px}
.mark{width:62px;height:62px;border-radius:50%;background:#e8f3ea;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.btn{display:inline-block;margin-top:12px;background:#ffdc00;color:#000;text-decoration:none;font-weight:600;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:17px 32px;border-radius:10px}
.btn:hover{background:#f0cf00}
.small{font-size:14px;color:#707070}
@media(max-width:520px){.box{padding:32px 20px}h1{font-size:26px}.btn{display:block}}
</style>
</head>
<body>
<div class="box">
  <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2f7a45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg></div>
  <h1>Оплата прошла</h1>
  <p>Спасибо за покупку. Письмо с доступом ко всем материалам уже ушло на вашу почту, обычно приходит в течение минуты.</p>
  <p class="small">Не нашли письмо? Проверьте папки «Спам», «Реклама», «Соцсети» или «Промоакции».</p>
  <a class="btn" href="index.html">Вернуться на сайт</a>
</div>
</body>
</html>
