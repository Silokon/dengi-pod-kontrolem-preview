<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<title>Оплата не прошла</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f1f1;color:#1c1b18;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;line-height:1.6;padding:24px}
.box{background:#fff;border:1px solid #e6e6e6;border-radius:10px;max-width:520px;width:100%;padding:44px 40px;text-align:center}
h1{font-size:30px;font-weight:800;letter-spacing:-0.02em;margin:0 0 14px}
p{color:#555550;margin:0 0 16px}
.mark{width:62px;height:62px;border-radius:50%;background:#fbe9e2;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.btn{display:inline-block;margin-top:12px;background:#ffdc00;color:#000;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:17px 32px;border-radius:10px}
.btn:hover{background:#f0cf00}
.small{font-size:14px;color:#707070}
@media(max-width:520px){.box{padding:32px 20px}h1{font-size:26px}.btn{display:block}}
</style>
</head>
<body>
<div class="box">
  <div class="mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"><path d="M12 6v8"></path><path d="M12 18h.01"></path></svg></div>
  <h1>Оплата не прошла</h1>
  <p>Платёж отменён или банк его не пропустил. Деньги не списаны, можно попробовать ещё раз или выбрать другой способ оплаты.</p>
  <p class="small">Если ошибка повторяется, напишите на [ПОЧТА], оформим заказ вручную.</p>
  <a class="btn" href="index.html#tarify">Попробовать снова</a>
</div>
</body>
</html>
