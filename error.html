<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оплата не прошла</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f5f2;color:#1a1a1a;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:17px;line-height:1.6;padding:24px}
.box{background:#fff;border:1px solid #e5e2dc;border-radius:16px;max-width:520px;width:100%;padding:44px 40px;text-align:center}
h1{font-size:30px;font-weight:800;letter-spacing:-0.02em;margin:0 0 14px}
p{color:#4a4a4a;margin:0 0 16px}
.mark{width:62px;height:62px;border-radius:50%;background:#fbe9e2;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.btn{display:inline-block;margin-top:12px;background:#e8502a;color:#fff;text-decoration:none;font-weight:600;padding:15px 32px;border-radius:10px}
.small{font-size:14px;color:#7d7d7d}
@media(max-width:520px){.box{padding:32px 22px}}
</style>
</head>
<body>
<div class="box">
  <div class="mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"><path d="M12 6v8"></path><path d="M12 18h.01"></path></svg></div>
  <h1>Оплата не прошла</h1>
  <p>Платёж отменён или банк его не пропустил. Деньги не списаны, можно попробовать ещё раз или выбрать другой способ оплаты.</p>
  <p class="small">Если ошибка повторяется, напишите нам, оформим заказ вручную.</p>
  <a class="btn" href="index.html#tarify">Попробовать снова</a>
</div>
</body>
</html>
